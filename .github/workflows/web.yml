# Met en ligne Vitrine sur GitHub Pages à chaque modification de main :
# le site de présentation à la racine, l'appli web dans /app (voir scripts/build-site.mjs).
name: Version web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valeurs PUBLIQUES (adresse du serveur et clé « anon ») : la sécurité repose sur la RLS.
      EXPO_PUBLIC_SUPABASE_URL: https://fcnkaomxrmcprqrmpycu.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjbmthb214cm1jcHJxcm1weWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzMwNzYsImV4cCI6MjEwOTE0OTA3Nn0.zyqASi9YUs-DJyW4TslLIxJe7XXci5Q7-6aosY3u0uQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx expo export -p web
      - run: node scripts/web-icons.mjs
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
