# Importe les musiques des stories (créées avec Creatify) dans le dépôt : assets/sons/<id>.mp3.
# Se lance quand la liste assets/sons/sources.txt change (une ligne par musique : « id adresse »).
# Chaque musique est vérifiée, mise au même volume (-16 LUFS) et réenregistrée en mp3 128 kbit/s.
name: Musiques des stories

on:
  push:
    paths: ['assets/sons/sources.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Télécharger et préparer les musiques
        run: |
          set -euo pipefail
          mkdir -p /tmp/sons
          while read -r id url; do
            [ -z "${id:-}" ] && continue
            case "$id" in \#*) continue;; esac
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "id invalide : $id"; exit 1; }
            [[ "$url" =~ ^https://cdn\.creatify\.ai/ ]] || { echo "adresse refusée : $url"; exit 1; }
            curl -fsSL --retry 3 -o "/tmp/sons/$id.src" "$url"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/sons/$id.src"
            ffmpeg -v error -y -i "/tmp/sons/$id.src" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -ac 2 -b:a 128k "assets/sons/$id.mp3"
          done < assets/sons/sources.txt
          ls -la assets/sons
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sons/*.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Musiques des stories : import depuis Creatify"
          git push
