# Extrait de configuration Supabase CLI pour Vitrine (fusionner avec `supabase init` si besoin).
project_id = "vitrine"

[auth]
site_url = "vitrine://"
additional_redirect_urls = ["vitrine://**", "exp://**"]

[auth.email]
enable_signup = true
# Connexion par e-mail + mot de passe, sans e-mail de confirmation à l'inscription.
enable_confirmations = false
# Le code (8 chiffres) ne sert plus que pour « Mot de passe oublié » (modèle « Reset Password » avec {{ .Token }}).
otp_length = 8

[auth.password]
min_length = 6

# Ces deux fonctions sont appelées par Meta (pas par l'app) : pas de jeton utilisateur.
# Elles vérifient elles-mêmes une signature HMAC.
[functions.meta-oauth]
verify_jwt = false

[functions.meta-data-deletion]
verify_jwt = false

# Appelée par Stripe (pas par l'app) : vérifie elle-même la signature Stripe-Signature.
[functions.stripe-webhook]
verify_jwt = false

# Équipe : l'action « login » (connexion d'un employé avec son code) se fait sans être connecté.
# La fonction vérifie elle-même le jeton pour toutes les autres actions.
[functions.team]
verify_jwt = false
