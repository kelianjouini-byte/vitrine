<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vitrine</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../legal.css" />
  <style>
    body { background: #F8FAF7; color: #24332B; font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    h1 { font-family: Georgia, serif; color: #2F7658; font-size: 30px; margin: 16px 0 12px; }
    p { font-size: 18px; line-height: 1.5; color: #24332B; }
    .soft { color: #758078; font-size: 16px; }
    .ok { width: 72px; height: 72px; border-radius: 50%; background: #DCEFE3; display: inline-flex; align-items: center; justify-content: center; }
    a.btn { display: block; margin-top: 28px; background: #2F7658; color: #fff; text-decoration: none; font-size: 18px; font-weight: 700; padding: 16px; border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="ok" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2F7658" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="titre">Merci, c'est enregistré !</h1>
    <p id="texte">Votre abonnement est en place. Rouvrez l'appli Vitrine sur votre téléphone : elle se débloque toute seule.</p>
    <p class="soft" id="petit">Vous recevrez un reçu par e-mail.</p>
    <a class="btn" href="mailto:contact@vitrineappli.fr" id="contact" hidden>Écrire à Vitrine</a>
  </main>
  <script>
    // Message selon le résultat (adresse « …/merci/?etat=… »).
    var p = new URLSearchParams(location.search);
    var etat = p.get('etat'), paiement = p.get('paiement');
    var msg = {
      annule: ["Paiement annulé", "Rien n'a été prélevé. Vous pouvez reprendre depuis l'e-mail quand vous voulez.", ""],
      deja: ["Vous êtes déjà abonné", "Votre abonnement est déjà en place. Rouvrez simplement l'appli Vitrine.", ""],
      complet: ["Offre fondateur complète", "La dernière place vient d'être prise. Les autres offres de l'e-mail restent disponibles.", ""],
      expire: ["Ce lien n'est plus valable", "Ouvrez l'appli Vitrine et touchez « Renvoyer l'e-mail » pour recevoir un nouveau lien.", ""],
      erreur: ["Un petit souci", "La page de paiement n'a pas pu s'ouvrir. Réessayez dans un instant, ou écrivez-nous.", ""]
    };
    var key = etat === 'paiement' ? (paiement === 'annule' ? 'annule' : null) : etat;
    if (key && msg[key]) {
      document.getElementById('titre').textContent = msg[key][0];
      document.getElementById('texte').textContent = msg[key][1];
      document.getElementById('petit').textContent = msg[key][2];
      document.querySelector('.ok').hidden = true;
      if (key === 'erreur' || key === 'expire') document.getElementById('contact').hidden = false;
    }
  </script>
</body>
</html>
